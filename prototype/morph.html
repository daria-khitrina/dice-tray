<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gear ↔ Close morph prototype</title>
<style>
:root{--bg:#0b0b0c;--bg-lift:#161617;--ink:#f3f1ec;--icon:#6f6d6a;--icon-hi:#a3a09b;--line:#262628}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
.sub{color:var(--icon-hi);font-size:13px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:900px}
.card{background:var(--bg-lift);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.card h2{font-size:14px;margin:0;align-self:flex-start}
.card h2 small{color:var(--icon-hi);font-weight:400}
.btn{width:88px;height:88px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--icon-hi);display:grid;place-items:center;cursor:pointer;transition:color .2s}
.btn:hover{color:var(--ink)}
.btn svg{width:44px;height:44px;overflow:visible}
.row{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--icon-hi)}
.row input[type=range]{flex:1;accent-color:var(--icon-hi)}
.row output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.stat{font-size:12px;color:var(--icon)}
.global{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--icon-hi);align-items:center}
select{background:var(--bg-lift);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
</style>
</head>
<body>
<h1>Gear ↔ Close morph</h1>
<p class="sub">Same source paths (taken from index.html) in both panels. Click a button or drag the scrubber.</p>

<div class="global">
  <label>Duration <input id="dur" type="range" min="150" max="1500" step="50" value="500"> <output id="durOut">500ms</output></label>
  <label>Easing <select id="ease"><option value="inOut">ease in-out</option><option value="out">ease out</option><option value="linear">linear</option></select></label>
  <label><input id="spin" type="checkbox" checked> rotate 90° while morphing</label>
</div>

<div class="grid">
  <section class="card">
    <h2>Flubber <small>MIT · ~10 KB · no deps</small></h2>
    <button class="btn" id="fBtn" aria-label="Settings"><svg viewBox="0 0 24 24" id="fSvg"><g id="fG" style="transform-origin:12px 12px"><path id="fOuter" fill="currentColor"/><path id="fHole" fill="currentColor"/></g></svg></button>
    <div class="row">scrub <input id="fScrub" type="range" min="0" max="1" step="0.001" value="0"><output id="fOut">0.00</output></div>
    <div class="stat" id="fStat"></div>
  </section>

  <section class="card">
    <h2>GSAP MorphSVG <small>free since 3.13 · custom license</small></h2>
    <button class="btn" id="gBtn" aria-label="Settings"><svg viewBox="0 0 24 24" id="gSvg"><g id="gG" style="transform-origin:12px 12px"><path id="gOuter" fill="currentColor"/><path id="gHole" fill="currentColor"/></g></svg></button>
    <div class="row">scrub <input id="gScrub" type="range" min="0" max="1" step="0.001" value="0"><output id="gOut">0.00</output></div>
    <div class="stat" id="gStat"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MorphSVGPlugin.min.js"></script>
<script>
// Shapes. GEAR_* is the gear from index.html split into outer ring + hole.
// X is the index.html close icon (stroke 2.4, round caps) converted to a filled polygon, since both libs morph fills.
const GEAR_OUTER='M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58z';
const GEAR_HOLE ='M12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z';
const X_OUTER   ='M4.15 5.85L5.85 4.15L12 10.3L18.15 4.15L19.85 5.85L13.7 12L19.85 18.15L18.15 19.85L12 13.7L5.85 19.85L4.15 18.15L10.3 12Z';
const X_HOLE    ='M12 12.3A.3.3 0 1 1 12 11.7a.3.3 0 0 1 0 .6z'; // hole collapses to a dot at centre

const EASE={linear:t=>t,out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const $=id=>document.getElementById(id);
const dur=()=>+$('dur').value, spin=()=>$('spin').checked, ease=()=>EASE[$('ease').value];
$('dur').oninput=e=>$('durOut').textContent=e.target.value+'ms';

// ---------- Flubber ----------
(()=>{
  const t0=performance.now();
  const opt={maxSegmentLength:1};
  const outer=flubber.interpolate(GEAR_OUTER,X_OUTER,opt);
  const hole =flubber.interpolate(GEAR_HOLE,X_HOLE,opt);
  $('fStat').textContent='precompute '+(performance.now()-t0).toFixed(1)+' ms';
  const g=$('fG'),o=$('fOuter'),h=$('fHole');
  let p=0, raf=0, open=false;
  function render(v){
    p=v; o.setAttribute('d',outer(v)); h.setAttribute('d',hole(v));
    g.style.transform=spin()?`rotate(${v*90}deg)`:'none';
    $('fScrub').value=v; $('fOut').textContent=v.toFixed(2);
  }
  function go(to){
    cancelAnimationFrame(raf);
    const from=p, start=performance.now(), d=dur()*Math.abs(to-from), e=ease();
    (function step(now){
      const k=d?Math.min(1,(now-start)/d):1;
      render(from+(to-from)*e(k));
      if(k<1) raf=requestAnimationFrame(step);
    })(start);
  }
  $('fBtn').onclick=()=>{open=!open; go(open?1:0); $('fBtn').setAttribute('aria-label',open?'Done':'Settings');};
  $('fScrub').oninput=e=>{cancelAnimationFrame(raf); open=+e.target.value>.5; render(+e.target.value);};
  render(0);
})();

// ---------- GSAP MorphSVG ----------
(()=>{
  gsap.registerPlugin(MorphSVGPlugin);
  const o=$('gOuter'),h=$('gHole'),g=$('gG');
  o.setAttribute('d',GEAR_OUTER); h.setAttribute('d',GEAR_HOLE);
  let tl, open=false;
  function build(){
    const prog=tl?tl.progress():0;
    if(tl) tl.kill();
    const ez=$('ease').value==='inOut'?'power3.inOut':$('ease').value==='out'?'power3.out':'none';
    tl=gsap.timeline({paused:true,defaults:{duration:dur()/1000,ease:ez},
      onUpdate(){ $('gScrub').value=tl.progress(); $('gOut').textContent=tl.progress().toFixed(2); }});
    // shapeIndex 'auto' lets MorphSVG pick the best start point; map:'complexity' pairs segments by size
    tl.to(o,{morphSVG:{shape:X_OUTER,shapeIndex:'auto',map:'complexity'}},0)
      .to(h,{morphSVG:{shape:X_HOLE,shapeIndex:'auto'}},0);
    if(spin()) tl.to(g,{rotation:90,svgOrigin:'12 12'},0);
    tl.progress(prog);
  }
  build();
  $('gBtn').onclick=()=>{open=!open; build(); open?tl.play():tl.reverse(); $('gBtn').setAttribute('aria-label',open?'Done':'Settings');};
  $('gScrub').oninput=e=>{tl.pause(); open=+e.target.value>.5; tl.progress(+e.target.value);};
  ['dur','ease','spin'].forEach(id=>$(id).addEventListener('change',build));
  $('gStat').textContent='gsap '+gsap.version;
})();
</script>
</body>
</html>
